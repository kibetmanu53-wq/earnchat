services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: earnchat
      POSTGRES_PASSWORD: earnchat
      POSTGRES_DB: earnchat
    ports:
      - '5432:5432'
    volumes:
      - earnchat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U earnchat']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  earnchat-pgdata:
