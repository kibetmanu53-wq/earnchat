services:
  - type: web
    name: earnchat
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: earnchat-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/earnchat.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: EARNINGS_ADMIN_SECRET
        generateValue: true
      - key: INTASEND_PUBLISHABLE_KEY
        sync: false
      - key: INTASEND_SECRET_KEY
        sync: false
      - key: INTASEND_WEBHOOK_CHALLENGE
        sync: false
      - key: INTASEND_CALLBACK_URL
        sync: false
