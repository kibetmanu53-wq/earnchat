services:
  - type: web
    name: earnchat
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: unchat-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/unchat.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: EARNINGS_ADMIN_SECRET
        generateValue: true
